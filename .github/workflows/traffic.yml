name: GitHub Traffic Badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch and Save Traffic Data
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            // Взимане на посещенията
            const views = await github.rest.repos.getViews({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            // Взимане на клониранията
            const clones = await github.rest.repos.getClones({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            // Създаване на папка, ако я няма
            if (!fs.existsSync('traffic')) {
              fs.mkdirSync('traffic');
            }
            
            // Записване на данните във файлове
            fs.writeFileSync('traffic/views.json', JSON.stringify({ count: views.data.count, uniques: views.data.uniques }));
            fs.writeFileSync('traffic/clones.json', JSON.stringify({ count: clones.data.count, uniques: clones.data.uniques }));

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add traffic/*.json
          git commit -m "Update traffic stats [skip ci]" || exit 0
          git push origin main
