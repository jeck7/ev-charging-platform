server.port=8082
spring.application.name=station-management

# SSL/TLS Configuration for mTLS
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/station-management.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=station-management
server.ssl.trust-store=classpath:keystore/truststore.jks
server.ssl.trust-store-password=changeit
server.ssl.trust-store-type=JKS
# Require client certificate authentication (mTLS)
server.ssl.client-auth=none

spring.datasource.url=jdbc:postgresql://localhost:5432/ev_charging
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Station Import Configuration
# Scheduled import runs daily at 2 AM for Bulgaria
# To change schedule, modify @Scheduled annotation in StationImportService

# External API Integrations
# Open Charge Map API (optional but recommended - get free key at https://openchargemap.org/site/develop/api)
openchargemap.api.key=5833eb50-b015-46d2-b136-c6c0c5c3d14b

# Chargeprice API (stations + prices; demo: https://tally.so/r/w4pJAX, commercial: sales@chargeprice.net)
chargeprice.api.base-url=https://api.chargeprice.net
chargeprice.api.key=

# Eco-Movement Data API (OCPI locations + prices; commercial: https://developers.eco-movement.com/)
ecomovement.api.base-url=https://api.eco-movement.com
ecomovement.api.token=

# Tesla API (optional - requires OAuth credentials)
tesla.client.id=
tesla.client.secret=

# Jackson configuration for LocalDateTime serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
