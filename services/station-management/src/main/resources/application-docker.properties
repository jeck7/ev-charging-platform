# Docker-specific SSL/TLS configuration
# Certificates are mounted as volumes in docker-compose.yml
server.ssl.enabled=true
server.ssl.key-store=file:/app/keystore/station-management.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=station-management
server.ssl.trust-store=file:/app/keystore/truststore.jks
server.ssl.trust-store-password=changeit
server.ssl.trust-store-type=JKS
server.ssl.client-auth=need
