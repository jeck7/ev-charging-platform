events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream backend services
    upstream station-management {
        server station-management:8082;
    }

    upstream charging-sessions {
        server charging-sessions:8081;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server with mTLS
    server {
        listen 443 ssl http2;
        server_name localhost;

        # Server SSL certificate (self-signed for development)
        ssl_certificate /etc/nginx/ssl/server-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/server-key.pem;

        # Client certificate authentication (mTLS)
        ssl_client_certificate /etc/nginx/ssl/ca-cert.pem;
        ssl_verify_client optional;
        ssl_verify_depth 2;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # CORS headers for Angular frontend
        add_header Access-Control-Allow-Origin "https://localhost:4200" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://localhost:4200";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }

        # Auth endpoints (login/register) - no client cert required for browser
        location /api/auth {
            proxy_pass https://station-management;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/ssl/ca-cert.pem;
            proxy_ssl_certificate /etc/nginx/ssl/client-cert.pem;
            proxy_ssl_certificate_key /etc/nginx/ssl/client-key.pem;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy to Station Management service
        location /api/stations {
            # Verify client certificate
            if ($ssl_client_verify != SUCCESS) {
                return 403 "Client certificate required";
            }

            proxy_pass https://station-management;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/ssl/ca-cert.pem;
            proxy_ssl_certificate /etc/nginx/ssl/client-cert.pem;
            proxy_ssl_certificate_key /etc/nginx/ssl/client-key.pem;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-SSL-Client-Cert $ssl_client_cert;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        }

        # Proxy to Charging Sessions service
        location /api/sessions {
            # Verify client certificate
            if ($ssl_client_verify != SUCCESS) {
                return 403 "Client certificate required";
            }

            proxy_pass https://charging-sessions;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/ssl/ca-cert.pem;
            proxy_ssl_certificate /etc/nginx/ssl/client-cert.pem;
            proxy_ssl_certificate_key /etc/nginx/ssl/client-key.pem;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-SSL-Client-Cert $ssl_client_cert;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        }

        # Serve Angular frontend (static files)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index index.html;
        }
    }
}
